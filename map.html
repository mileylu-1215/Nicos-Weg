<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Nicos Berlin</title>
<style>
:root{--ink:#1b2a3b;--taxi:#FFB300;--paper:#fff8ea;--muted:#6b7280}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#8fc9f0;font-family:"Nunito","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
#world{position:absolute;inset:0;overflow:hidden;touch-action:none}
#map{position:absolute;left:0;top:0;width:1400px;height:1320px;transform-origin:0 0;will-change:transform}
#map svg.ground{position:absolute;left:0;top:0}
.b{position:absolute;transform:translate(-50%,-100%);transition:filter .3s,transform .3s}
.b img{display:block;width:100%;pointer-events:none}
.b.locked img{filter:grayscale(.9) brightness(1.08) opacity(.55)}
.b .tag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);white-space:nowrap;background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.b.locked .tag{background:rgba(27,42,59,.72);color:#fff}
.b.cur{filter:drop-shadow(0 0 14px rgba(255,179,0,.9))}
.b.cur .tag{background:var(--taxi)}
.b.cur:after{content:"▼";position:absolute;left:50%;top:-34px;transform:translateX(-50%);color:var(--taxi);font-size:26px;animation:bob 1.2s ease-in-out infinite;text-shadow:0 2px 4px rgba(0,0,0,.25)}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-10px}}
.b:active{transform:translate(-50%,-100%) scale(.97)}
#nico{position:absolute;width:46px;transform:translate(-50%,-100%);transition:left 1.4s cubic-bezier(.4,0,.2,1),top 1.4s cubic-bezier(.4,0,.2,1);pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
#nico img{width:100%;display:block}
.walk{animation:walk .5s steps(2) infinite}
@keyframes walk{0%{transform:translate(-50%,-100%) rotate(-4deg)}100%{transform:translate(-50%,-100%) rotate(4deg)}}
#taxi{position:absolute;width:70px;transform:translate(-50%,-50%);pointer-events:none}
.hud{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}
.pill{background:rgba(27,42,59,.78);color:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:800;backdrop-filter:blur(6px);pointer-events:auto}
.card{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:var(--paper);border-radius:22px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:5;display:flex;gap:12px;align-items:center;transition:transform .35s}
.card.hide{transform:translateY(140%)}
.card img{width:70px;height:70px;object-fit:contain;flex:none}
.card b{display:block;font-size:17px;line-height:1.2}.card .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.btn{margin-top:8px;background:var(--taxi);border-radius:12px;padding:9px 12px;text-align:center;font-weight:900;box-shadow:0 4px 0 #d99a00;font-size:15px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d99a00}
.cloud{position:absolute;width:160px;opacity:.9;pointer-events:none;animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1600px)}}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.8);background:rgba(27,42,59,.85);color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;opacity:0;transition:.25s;z-index:9;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style></head><body>
<div id="world"><div id="map">
 <svg class="ground" width="1400" height="1320" viewBox="0 0 1400 1320">
  <defs>
   <pattern id="grass" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#9ed58a"/><circle cx="8" cy="12" r="2" fill="#8fc97b"/><circle cx="28" cy="30" r="2.5" fill="#8fc97b"/><circle cx="20" cy="4" r="1.5" fill="#b4e3a2"/></pattern>
   <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <!-- island -->
  <polygon points="700,80 1340,560 700,1260 60,560" fill="#6fb062"/>
  <polygon points="700,60 1340,540 700,1240 60,540" fill="url(#grass)"/>
  <!-- water edge glints -->
  <polygon points="700,60 1340,540 700,1240 60,540" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="6"/>
  <!-- roads: isometric ring + spokes -->
  <g fill="none" stroke="#d9d2c2" stroke-width="54" stroke-linejoin="round" stroke-linecap="round">
   <path id="ring" d="M700,300 L1100,540 L700,1080 L300,540 Z"/>
   <path d="M300,540 L140,540 M1100,540 L1260,540 M700,300 L700,160 M700,1080 L700,1180"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="18 16" opacity=".8">
   <path d="M700,300 L1100,540 L700,1080 L300,540 Z"/>
  </g>
  <!-- central plaza -->
  <polygon points="700,560 880,680 700,800 520,680" fill="#e8e0cf"/>
  <polygon points="700,560 880,680 700,800 520,680" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3"/>
  <!-- trees -->
  <g id="tree"><ellipse cx="0" cy="6" rx="16" ry="6" fill="#000" opacity=".15"/><rect x="-4" y="-10" width="8" height="18" rx="3" fill="#8a5a2b"/><circle cx="0" cy="-22" r="20" fill="#5fae55"/><circle cx="-9" cy="-14" r="13" fill="#78c46d"/><circle cx="9" cy="-16" r="12" fill="#6bbd60"/></g>
  <use href="#tree" x="420" y="330"/><use href="#tree" x="470" y="300"/><use href="#tree" x="980" y="330"/><use href="#tree" x="1030" y="370"/>
  <use href="#tree" x="240" y="700"/><use href="#tree" x="1160" y="720"/><use href="#tree" x="560" y="1120"/><use href="#tree" x="840" y="1130"/>
  <use href="#tree" x="620" y="920"/><use href="#tree" x="790" y="930"/>
 </svg>
 <img class="cloud" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 60'><ellipse cx='50' cy='40' rx='40' ry='18' fill='white'/><ellipse cx='90' cy='32' rx='45' ry='22' fill='white'/><ellipse cx='125' cy='42' rx='30' ry='15' fill='white'/></svg>" style="top:40px;animation-delay:-20s">
 <img class="cloud" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 60'><ellipse cx='50' cy='40' rx='40' ry='18' fill='white'/><ellipse cx='90' cy='32' rx='45' ry='22' fill='white'/><ellipse cx='125' cy='42' rx='30' ry='15' fill='white'/></svg>" style="top:1180px;animation-delay:-45s">
 <div id="buildings"></div>
 <img id="taxi" alt="" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 70 40'><ellipse cx='35' cy='34' rx='30' ry='6' fill='black' opacity='.2'/><rect x='4' y='14' width='62' height='18' rx='7' fill='%23FFB300'/><path d='M14 15 q8 -12 22 -12 h10 q10 0 16 12z' fill='%23FFB300'/><path d='M18 14 q6 -8 18 -8 h8 q8 0 12 8z' fill='%23cfe9ff'/><rect x='28' y='-1' width='14' height='6' rx='2' fill='%231b2a3b'/><circle cx='18' cy='32' r='6' fill='%23222'/><circle cx='52' cy='32' r='6' fill='%23222'/></svg>">
 <div id="nico"><img src="assets/characters/nico.png" alt=""></div>
</div></div>
<div class="hud"><a class="pill" id="title" href="index.html" style="text-decoration:none">‹ 🏙 Nicos Berlin</a><span class="pill" id="stat">⭐ 0 · 🔥 1 天</span></div>
<div class="card" id="card"><img id="cimg" alt=""><div style="flex:1;min-width:0"><b id="ctitle"></b><div class="s" id="csub"></div><div class="btn" id="cbtn">▶ 进入</div></div></div>
<div id="toast"></div>
<script>
const A="assets/";
// 章节 → 建筑 → 集数（A1 76 集，每栋楼 6～7 集）
const TOWN=[
 {id:"flughafen", name:"Flughafen", zh:"机场", eps:[1,4],  x:700, y:260,  w:230},
 {id:"wg",        name:"WG",        zh:"合租公寓", eps:[5,12], x:1060,y:470, w:200},
 {id:"cafe",      name:"Café",      zh:"咖啡馆", eps:[13,16],x:1250,y:720, w:190},
 {id:"sprachschule",name:"Sprachschule",zh:"语言学校",eps:[17,24],x:1080,y:940,w:210},
 {id:"baeckerei", name:"Bäckerei",  zh:"面包店", eps:[25,28],x:760, y:1110,w:180},
 {id:"supermarkt",name:"Supermarkt",zh:"超市",   eps:[29,36],x:440, y:1050,w:210},
 {id:"restaurant",name:"Restaurant",zh:"餐厅",   eps:[37,44],x:250, y:880, w:200},
 {id:"park",      name:"Park",      zh:"公园",   eps:[45,52],x:300, y:560, w:220},
 {id:"fahrrad",   name:"Fahrrad",   zh:"自行车店",eps:[53,56],x:460, y:360, w:180},
 {id:"bahnhof",   name:"Bahnhof",   zh:"火车站", eps:[57,64],x:980, y:300, w:200},
 {id:"arztpraxis",name:"Arztpraxis",zh:"诊所",   eps:[65,72],x:420, y:800, w:170},
 {id:"boutique",  name:"Boutique",  zh:"服装店", eps:[73,76],x:980, y:760, w:170},
 {id:"rathaus",   name:"Rathaus",   zh:"市政厅", eps:[77,76],x:700, y:720, w:260, center:true},
];
// 进度来自主程序 index.html 的存档 nicosweg-v3
function loadSave(){
  try{ const s=JSON.parse(localStorage.getItem("nicosweg-v3")||"{}"); return {ep:s.ep||{}, items:s.items||[]}; }
  catch(e){ return {ep:{}, items:[]}; }
}
const S=loadSave();
const LV_ID="A1";
const isWon=n=>!!(S.ep[LV_ID+"-"+n]&&S.ep[LV_ID+"-"+n].won);
const range=(a,b)=>Array.from({length:Math.max(0,b-a+1)},(_,i)=>a+i);
const nextEp=()=>range(1,76).find(n=>!isWon(n))||null;          // 全局第一个没通关的集
const firstUnwonIn=b=>range(b.eps[0],b.eps[1]).find(n=>!isWon(n))||b.eps[0];
const wonCount=()=>range(1,76).filter(isWon).length;
const map=document.getElementById("map"), bl=document.getElementById("buildings");
function stateOf(b){
  if(b.center) return range(1,76).every(isWon)?"done":"locked";
  const eps=range(b.eps[0],b.eps[1]);
  if(eps.every(isWon)) return "done";
  const n=nextEp();
  if(n&&n>=b.eps[0]&&n<=b.eps[1]) return "cur";   // 全局下一集在这栋楼
  if(eps.some(isWon)) return "cur";               // 跳着玩过，楼里有通关的集
  return "locked";
}
function render(){ bl.innerHTML=TOWN.map(b=>{ const st=stateOf(b); const stars=st==="done"?"⭐⭐⭐":st==="cur"?`第 ${firstUnwonIn(b)} 集 ▶`:b.center?"🔒":"还没到";
  return `<div class="b ${st}" data-id="${b.id}" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;z-index:${Math.round(b.y)}"><img src="${A}buildings/${b.id}.png" alt=""><span class="tag">${b.name} · ${stars}</span></div>`; }).join("");
  bl.querySelectorAll(".b").forEach(el=>el.onclick=()=>select(el.dataset.id));
  const cur=TOWN.find(b=>stateOf(b)==="cur")||TOWN[0]; placeNico(cur,false); select(cur.id,true); }
const nico=document.getElementById("nico");
function placeNico(b,walk){ nico.style.left=(b.x+b.w*0.42)+"px"; nico.style.top=(b.y+16)+"px"; nico.style.zIndex=b.y+1; if(walk){ nico.classList.add("walk"); setTimeout(()=>nico.classList.remove("walk"),1400); } }
function select(id,quiet){
  const b=TOWN.find(x=>x.id===id); const st=stateOf(b);
  const target=b.center?null:firstUnwonIn(b);
  document.getElementById("cimg").src=A+"buildings/"+b.id+".png";
  document.getElementById("ctitle").textContent=`${b.zh} ${b.name}`+(b.center?"":` · 第 ${b.eps[0]}–${b.eps[1]} 集`);
  document.getElementById("csub").textContent=
    b.center?"通关 A1 全部 76 集后开放，Nico 在这里拿到居留证":
    st==="done"?"已通关，可以回来重玩":
    st==="cur"?`下一集：第 ${target} 集。点进入继续`:
    "Nico 还没走到这里，也可以先进去看看";
  const btn=document.getElementById("cbtn");
  btn.textContent= b.center?(st==="done"?"🏛 已开放":"🔒 未开放"): st==="done"?"重玩这栋楼 ›": st==="locked"?`进入第 ${b.eps[0]} 集 ›`:`▶ 进入第 ${target} 集`;
  btn.onclick=()=>{
    if(b.center){ toast(st==="done"?"市政厅剧情还在制作中":"通关 A1 全部 76 集后开放"); return; }
    location.href="index.html?ep="+LV_ID+"-"+(st==="cur"?target:b.eps[0]);
  };
  if(!quiet){ placeNico(b,true); focusOn(b); }
}
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1500); }
// 出租车绕环路跑
const taxi=document.getElementById("taxi"); const ringPts=[[700,300],[1100,540],[700,1080],[300,540]]; let tp=0,tt=0;
(function drive(){ const a=ringPts[tp], b=ringPts[(tp+1)%4]; tt+=0.004; if(tt>=1){tt=0;tp=(tp+1)%4;} const x=a[0]+(b[0]-a[0])*tt, y=a[1]+(b[1]-a[1])*tt; taxi.style.left=x+"px"; taxi.style.top=y+"px"; taxi.style.zIndex=Math.round(y); taxi.style.transform=`translate(-50%,-50%) scaleX(${b[0]>=a[0]?1:-1})`; requestAnimationFrame(drive); })();
// 拖动 + 缩放
let sc=0.6, tx=0, ty=0; const world=document.getElementById("world");
function apply(){ const W=world.clientWidth,H=world.clientHeight; const mw=1400*sc,mh=1320*sc; tx=Math.min(40,Math.max(W-mw-40,tx)); ty=Math.min(40,Math.max(H-mh-40,ty)); map.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`; }
function focusOn(b){ const W=world.clientWidth,H=world.clientHeight; tx=W/2-(b.x)*sc; ty=H*0.42-(b.y-60)*sc; map.style.transition="transform .6s"; apply(); setTimeout(()=>map.style.transition="",600); }
let drag=null,pinch=null;
world.addEventListener("pointerdown",e=>{ if(e.target.closest(".card,.pill")) return; drag={x:e.clientX,y:e.clientY,tx,ty,moved:false}; world.setPointerCapture(e.pointerId); });
world.addEventListener("pointermove",e=>{ if(!drag) return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>4) drag.moved=true; tx=drag.tx+dx; ty=drag.ty+dy; apply(); });
world.addEventListener("pointerup",e=>{ drag=null; });
world.addEventListener("wheel",e=>{ e.preventDefault(); const k=e.deltaY<0?1.1:0.9; zoomAt(e.clientX,e.clientY,k); },{passive:false});
world.addEventListener("touchstart",e=>{ if(e.touches.length===2){ pinch={d:dist(e.touches),sc}; } },{passive:true});
world.addEventListener("touchmove",e=>{ if(pinch&&e.touches.length===2){ const d=dist(e.touches); const k=(pinch.sc*d/pinch.d)/sc; const cx=(e.touches[0].clientX+e.touches[1].clientX)/2, cy=(e.touches[0].clientY+e.touches[1].clientY)/2; zoomAt(cx,cy,k); } },{passive:true});
world.addEventListener("touchend",()=>pinch=null);
function dist(t){ return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY); }
function zoomAt(cx,cy,k){ const ns=Math.min(1.3,Math.max(0.35,sc*k)); k=ns/sc; tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k; sc=ns; apply(); }
// 初始化：居中到当前楼
document.getElementById("stat").textContent=`⭐ 通关 ${wonCount()}/76 · 🎒 ${S.items.length}`;
render(); sc=Math.max(0.42,Math.min(0.75,world.clientWidth/900)); const cur=TOWN.find(b=>stateOf(b)==="cur")||TOWN[0]; const W=world.clientWidth,H=world.clientHeight; tx=W/2-cur.x*sc; ty=H*0.42-(cur.y-60)*sc; apply();
window.addEventListener("resize",apply);
window.addEventListener("pageshow",e=>{ if(e.persisted) location.reload(); });
</script></body></html>
