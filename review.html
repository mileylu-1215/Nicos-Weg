<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8ea">
<title>Nicos Berlin · 快速复习预览</title>
<style>
:root{--taxi:#FFB300;--paper:#fff8ea;--ink:#1b2a3b;--muted:#687681;--ok:#238653;--bad:#d74343}
*{box-sizing:border-box}
body{margin:0;background:#dceef4;color:var(--ink);font-family:"Nunito","PingFang SC","Microsoft YaHei",sans-serif}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #2c6fbc;outline-offset:4px}
button:disabled{cursor:default}
[hidden]{display:none!important}
.app{max-width:520px;min-height:100dvh;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pill{border-radius:999px;padding:9px 14px;background:var(--ink);color:white;font-size:13px;font-weight:800}
.count{background:white;color:var(--ink);font-variant-numeric:tabular-nums}
.intro{margin:0;color:#50616e;font-size:12px;line-height:1.8}
.trip{position:relative;height:100px;overflow:hidden;border-radius:20px;background:#c7e5db}
.town{position:absolute;inset:12px 20px auto;display:flex;align-items:end;justify-content:space-between;font-size:31px}
.town span:nth-child(2){font-size:39px}
.road{position:absolute;bottom:0;left:0;right:0;height:32px;background:#637785}
.road:after{content:"";position:absolute;left:0;right:0;top:16px;border-top:2px dashed #d3dde3}
.taxi{position:absolute;bottom:9px;left:7%;font-size:34px;z-index:1;transition:left .4s;filter:drop-shadow(0 3px 2px #354a5355)}
.progress{height:8px;background:#fff9;border-radius:99px;overflow:hidden}
.progress i{display:block;width:0;height:100%;background:var(--taxi);transition:width .3s}
.card{flex:1;background:var(--paper);border:1px solid #fff;border-radius:24px;padding:24px 20px;box-shadow:0 8px 0 #aacbd455,0 18px 40px #36505f12}
.tag{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1px}
h1{font-size:28px;line-height:1.4;margin:16px 0 8px}
.sub{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 18px}
.play{display:block;border:0;border-radius:16px;padding:14px 20px;background:var(--taxi);box-shadow:0 4px 0 #d99a00;font-size:17px;font-weight:800;margin:16px 0 10px}
.audio-note{font-size:12px;color:var(--muted);min-height:18px;margin:0 0 16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.opt{background:#fff;border:2px solid #e5dccb;box-shadow:0 3px 0 #e5dccb;border-radius:16px;min-height:64px;padding:14px 8px;font-weight:800;font-size:18px;overflow-wrap:anywhere}
.opt:not(:disabled):active,.play:active{transform:translateY(3px);box-shadow:none}
.opt.ok{border-color:var(--ok);background:#e6f6ec;box-shadow:0 3px 0 var(--ok)}
.opt.bad{border-color:var(--bad);background:#fde9e9;box-shadow:0 3px 0 var(--bad);animation:shake .3s}
.feedback{min-height:48px;margin:20px 0 0;line-height:1.6;font-size:14px;font-weight:700}
.next,.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--taxi);padding:15px;text-align:center;font-size:16px;font-weight:800;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 #d99a00}
.secondary{background:white;box-shadow:0 3px 0 #e5dccb;margin-top:12px}
.footer{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.footer a{color:inherit;text-underline-offset:3px}
.combo{position:fixed;left:50%;top:35%;z-index:2;pointer-events:none;font-weight:900;font-size:40px;color:var(--taxi);text-shadow:0 3px 0 #985e13;opacity:0;transform:translate(-50%,-50%)}
.combo.show{animation:pop .8s ease-out}
.result{text-align:center}
.stars{font-size:42px;margin:16px 0}
.score{font-size:18px;font-weight:800}
.summary{display:flex;justify-content:center;gap:12px;margin:18px 0 24px}
.summary span{background:white;border-radius:12px;padding:12px;font-size:13px}
.list{list-style:none;padding:0;text-align:left;font-size:14px;margin:0 0 14px}
.list li{background:#fff;border-radius:12px;padding:12px;margin:8px 0}
.notice{margin:0;font-size:12px;color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}30%{opacity:1;transform:translate(-50%,-70%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-130%) scale(1)}}
@media(max-width:360px){.app{padding-left:12px;padding-right:12px}.card{padding:20px 14px}.opt{font-size:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.combo.show{opacity:1}}
</style>
</head>
<body>
<main class="app">
  <header class="hud"><span class="pill">🚕 快速复习</span><span class="pill count" id="stat">1 / 10</span></header>
  <p class="intro">互动预览 · 默认进度为第 9 集，尚未接入当前课程页。<br>不随机抽题：错题优先 → 最久未复习 → 词表顺序。</p>
  <div class="trip" aria-hidden="true"><div class="town"><span>🛬</span><span>🏡</span><span>☕</span><span>🌳</span></div><div class="road"></div><span class="taxi" id="taxi">🚕</span></div>
  <div class="progress" role="progressbar" aria-label="复习进度" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progress"><i id="prog"></i></div>
  <section class="card" id="card" aria-label="复习题目"></section>
  <p class="notice" id="notice" role="status"></p>
  <footer class="footer"><span id="comboStat">🔥 连击 ×0</span><a href="index.html">← 返回课程</a></footer>
</main>
<div class="combo" id="combo" aria-hidden="true"></div>
<script>
const SAVE_KEY="nico_save", REVIEW_KEY="nico_review";
function readSave(key,fallback){
  try{
    const value=JSON.parse(localStorage.getItem(key));
    return value&&typeof value==="object"&&!Array.isArray(value)?value:fallback;
  }catch(e){return fallback;}
}
const S=readSave(SAVE_KEY,{won:9});
if(!Number.isFinite(S.won)||S.won<0) S.won=9;
const R=readSave(REVIEW_KEY,{});
const TOWN=[
  {id:"flughafen",eps:[1,4]},{id:"wg",eps:[5,12]},{id:"cafe",eps:[13,16]},
  {id:"sprachschule",eps:[17,24]},{id:"baeckerei",eps:[25,28]},
  {id:"supermarkt",eps:[29,36]},{id:"restaurant",eps:[37,44]},{id:"park",eps:[45,52]},
  {id:"fahrrad",eps:[53,56]},{id:"bahnhof",eps:[57,64]},
  {id:"arztpraxis",eps:[65,72]},{id:"boutique",eps:[73,76]}
];
const VOCAB=[
  {id:"hallo",de:"Hallo",zh:"你好",art:null,b:"flughafen"},
  {id:"tschuess",de:"Tschüss",zh:"再见",art:null,b:"flughafen"},
  {id:"Name",de:"Name",zh:"名字",art:"der",b:"flughafen"},
  {id:"heissen",de:"heißen",zh:"叫（名字）",art:null,b:"flughafen"},
  {id:"Koffer",de:"Koffer",zh:"行李箱",art:"der",b:"flughafen"},
  {id:"Flughafen",de:"Flughafen",zh:"机场",art:"der",b:"flughafen",audio:"BAKU_B1_Flughafen"},
  {id:"Taxifahrer",de:"Taxifahrer",zh:"出租车司机",art:"der",b:"flughafen"},
  {id:"Deutschland",de:"Deutschland",zh:"德国",art:null,b:"flughafen"},
  {id:"Spanien",de:"Spanien",zh:"西班牙",art:null,b:"flughafen",audio:"BAKU_A1_spanien"},
  {id:"bitte",de:"bitte",zh:"请",art:null,b:"flughafen"},
  {id:"WG",de:"WG",zh:"合租公寓",art:"die",b:"wg"},
  {id:"Zimmer",de:"Zimmer",zh:"房间",art:"das",b:"wg"},
  {id:"Kueche",de:"Küche",zh:"厨房",art:"die",b:"wg"},
  {id:"Bad",de:"Bad",zh:"浴室",art:"das",b:"wg"},
  {id:"Tisch",de:"Tisch",zh:"桌子",art:"der",b:"wg"},
  {id:"Stuhl",de:"Stuhl",zh:"椅子",art:"der",b:"wg"},
  {id:"Bett",de:"Bett",zh:"床",art:"das",b:"wg"},
  {id:"Lampe",de:"Lampe",zh:"灯",art:"die",b:"wg"},
  {id:"wohnen",de:"wohnen",zh:"居住",art:null,b:"wg"},
  {id:"Schluessel",de:"Schlüssel",zh:"钥匙",art:"der",b:"wg"}
];
const audioOf=w=>"media/"+(w.audio||"BAKU_A1_"+w.id)+".mp3";
const count=value=>Number.isFinite(value)&&value>=0?value:0;
function record(id){
  const r=R[id]||{};
  return {wrong:count(r.wrong),right:count(r.right),lastSeen:count(r.lastSeen)};
}
function pickQueue(n=10){
  const unlocked=new Set(TOWN.filter(b=>S.won>=b.eps[0]-1).map(b=>b.id));
  return VOCAB.map((w,i)=>({w,i,r:record(w.id)}))
    .filter(p=>unlocked.has(p.w.b))
    .sort((a,b)=>b.r.wrong-a.r.wrong||a.r.lastSeen-b.r.lastSeen||a.i-b.i)
    .slice(0,n).map(p=>p.w);
}
function distractors(w){
  const ordered=[...VOCAB.filter(x=>x.b===w.b),...VOCAB.filter(x=>x.b!==w.b)];
  const seen=new Set([w.de]), out=[];
  for(const x of ordered){
    if(!seen.has(x.de)){seen.add(x.de);out.push(x.de);}
    if(out.length===3) break;
  }
  return out;
}
const queue=pickQueue();
let idx=0,combo=0,best=0,right=0,answered=false,audioContext;
const wrongList=[];
const card=document.getElementById("card"),stat=document.getElementById("stat");
const audio=new Audio();
let playback=0;
function play(w){
  const request=++playback;
  audio.pause();
  audio.src=audioOf(w);
  audio.play().catch(error=>{
    if(request!==playback) return;
    const note=document.getElementById("audioNote");
    if(note) note.textContent=error.name==="NotAllowedError"?"请点击「播放发音」开启声音。":"暂时无法播放，请再试一次。";
  });
}
function beep(ok){
  try{
    const Context=window.AudioContext||window.webkitAudioContext;
    if(!Context) return;
    audioContext=audioContext||new Context();
    audioContext.resume().catch(()=>{});
    const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();
    oscillator.connect(gain);gain.connect(audioContext.destination);
    oscillator.frequency.value=ok?880:220;
    gain.gain.setValueAtTime(.12,audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.2);
    oscillator.onended=()=>{oscillator.disconnect();gain.disconnect();};
    oscillator.start();oscillator.stop(audioContext.currentTime+.2);
  }catch(e){}
}
function showCombo(){
  const el=document.getElementById("combo");
  el.textContent=`🔥 ×${combo}`;
  el.classList.remove("show");void el.offsetWidth;el.classList.add("show");
}
function render(){
  answered=false;
  stat.textContent=`${Math.min(idx+1,queue.length)} / ${queue.length}`;
  document.getElementById("progress").setAttribute("aria-valuemax",queue.length);
  if(idx>=queue.length){finish();return;}
  const w=queue[idx];
  let type=["listen","article","zh2de"][idx%3];
  if(type==="article"&&!w.art) type="zh2de";
  const answer=type==="article"?w.art:w.de;
  const options=(type==="article"?["der","die","das"]:[w.de,...distractors(w)])
    .sort((a,b)=>a.localeCompare(b,"de"));
  const label=type==="listen"?"听音选词":type==="article"?"冠词挑战":"中 → 德";
  const title=type==="listen"?"🎧 听，这个词是？":type==="article"?`___ ${w.de}`:w.zh;
  const sub=type==="listen"?"听一听，选出你听到的德语。":type==="article"?w.zh:"选出对应的德语单词。";
  card.innerHTML=`<div class="tag">${label} · ${w.b==="wg"?"合租公寓":"机场"}</div>
    <h1 tabindex="-1" id="question">${title}</h1><p class="sub">${sub}</p>
    <button class="play" id="play" type="button" ${type==="listen"?"":"hidden"}>🔊 播放发音</button>
    <p class="audio-note" id="audioNote">${type==="listen"?"若未自动播放，请点击上方按钮。":""}</p>
    <div class="opts"></div><p class="feedback" id="feedback" role="status"></p>
    <button class="next" id="next" type="button" hidden>${idx===queue.length-1?"查看结果 →":"下一题 →"}</button>`;
  for(const option of options){
    const button=document.createElement("button");
    button.type="button";button.className="opt";button.textContent=option;
    button.onclick=()=>answerQ(button,option===answer,w,answer);
    card.querySelector(".opts").append(button);
  }
  document.getElementById("play").onclick=()=>play(w);
  document.getElementById("next").onclick=()=>{
    ++playback;audio.pause();idx++;render();
    card.querySelector("h1").focus();
  };
  if(type==="listen") play(w);
}
function answerQ(button,ok,w,answer){
  if(answered) return;
  answered=true;
  const rec=record(w.id);
  rec.lastSeen=Date.now();
  card.querySelectorAll(".opt").forEach(option=>{
    option.disabled=true;
    if(option.textContent===answer) option.classList.add("ok");
  });
  if(ok){
    right++;combo++;best=Math.max(best,combo);
    rec.right++;if(rec.wrong>0) rec.wrong--;
    if(combo>=2) showCombo();
  }else{
    button.classList.add("bad");combo=0;rec.wrong++;wrongList.push(w);
  }
  R[w.id]=rec;
  try{localStorage.setItem(REVIEW_KEY,JSON.stringify(R));}
  catch(e){document.getElementById("notice").textContent="浏览器无法保存记录，本轮仍可继续。";}
  beep(ok);play(w);
  document.getElementById("play").hidden=false;
  document.getElementById("audioNote").textContent="答后再听一遍，加深记忆。";
  document.getElementById("feedback").textContent=ok?`✓ 答对了！${w.art?w.art+" ":""}${w.de} — ${w.zh}`:`✗ 正确答案：${answer} · ${w.zh}`;
  document.getElementById("comboStat").textContent=`🔥 连击 ×${combo}`;
  const completed=idx+1,percent=completed/queue.length*100;
  document.getElementById("prog").style.width=percent+"%";
  document.getElementById("progress").setAttribute("aria-valuenow",completed);
  document.getElementById("taxi").style.left=7+percent*.76+"%";
  document.getElementById("next").hidden=false;
}
function finish(){
  const stars=right===10?"⭐⭐⭐":right>=8?"⭐⭐":right>=5?"⭐":"继续加油 🌱";
  card.innerHTML=`<div class="result"><div class="tag">本轮旅程结束</div>
    <h1 tabindex="-1">复习完成！</h1><div class="stars">${stars}</div>
    <p class="score">${right} / ${queue.length} 答对</p>
    <div class="summary"><span>🔥 最高连击 ×${best}</span><span>📖 复习 ${queue.length} 个词</span></div>
    ${wrongList.length?`<ul class="list">${wrongList.map(w=>`<li>❌ ${w.art?w.art+" ":""}${w.de} — ${w.zh}</li>`).join("")}</ul>
    <p class="sub">这些错词下次复习会优先出现。</p>`:`<p class="sub">全对！下次优先复习最久没见的词。</p>`}
    <a class="btn" href="review.html">再来一轮</a><a class="btn secondary" href="index.html">返回课程</a></div>`;
}
render();
</script>
</body>
</html>
